services:
  hkia:
    build: .
    image: hkia:local
    command:
      - mcp
      - --transport
      - http
      - --host
      - 0.0.0.0
      - --port
      - "8787"
    ports:
      - "8787:8787"
    environment:
      HKIA_DATA_DIR: /data
      HKIA_CONFIG: /config/config.toml
      HKIA_MCP_API_KEY: ${HKIA_MCP_API_KEY:-}
    volumes:
      - hkia-data:/data
      - hkia-config:/config
    restart: unless-stopped

volumes:
  hkia-data:
  hkia-config:
