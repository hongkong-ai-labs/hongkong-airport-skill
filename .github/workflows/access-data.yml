name: Access data

on:
  schedule:
    # Weekly on Monday 03:17 UTC (11:17 HKT) to catch official page changes.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Compare embedded access data with official sources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check access reference data
        id: check
        run: python3 scripts/refresh_access_data.py --check

      - name: Open an issue when data drifted
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const title = "Airport access reference data has drifted";
            const body = [
              "The scheduled check found differences between `data/access_*.json` and the official sources.",
              "",
              "Run `python3 scripts/refresh_access_data.py --write`, review the diff, and update `checked_on`.",
              "",
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "access-data",
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["access-data"],
              });
            }
